spring.application.name=campus-university-management
# A plain IDE Run starts the local site. Activate 'postgres' explicitly for PostgreSQL.
spring.profiles.default=demo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oop_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HTTPS deployments should set SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
campus.admin.email=${CAMPUS_ADMIN_EMAIL:}
campus.admin.password=${CAMPUS_ADMIN_PASSWORD:}
